<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PxModRim — Mod Organizer mockup (issue #37)</title>
<style>
  :root {
    --e0:#0b0d10; --e1:#121418; --e2:#1a1d21; --e3:#22262b; --e4:#2c3036;
    --border:#2f333a; --text:#f2f3f5; --muted:#949ba4; --dim:#6c737f;
    --primary:#66c0f4; --primary-bg:rgba(102,192,244,.1);
    --success:#3ba55d; --warning:#f9a825; --danger:#ed4245;
    --radius:6px;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#050608; color:var(--text);
    font:13px/1.35 "Inter","Segoe UI",system-ui,sans-serif; }
  body { display:flex; align-items:center; justify-content:center; padding:24px; }
  button { font:inherit; color:inherit; }
  .window { width:1360px; height:820px; display:grid; grid-template-rows:auto minmax(0,1fr) auto;
    background:var(--e1); border:1px solid var(--border); border-radius:10px; overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.6); }
  .titlebar { height:34px; display:flex; align-items:center; gap:10px; padding:0 12px;
    background:var(--e0); border-bottom:1px solid var(--border); color:var(--muted); font-size:12px; }
  .titlebar .dots { display:flex; gap:6px; } .titlebar .dots i { width:11px; height:11px; border-radius:50%; background:var(--e4); display:block; }
  .titlebar b { color:var(--text); font-weight:600; }
  .main { display:grid; grid-template-columns:168px 220px 1fr 300px; grid-template-rows:minmax(0,1fr); min-height:0; }

  /* rail */
  .rail { background:var(--e2); border-right:1px solid var(--border); padding:8px 0; }
  .rail-item { position:relative; margin:4px; height:36px; border-radius:6px; display:flex; align-items:center;
    gap:10px; padding-left:12px; color:var(--muted); cursor:pointer; }
  .rail-item:hover { background:var(--e3); }
  .rail-item.active { background:var(--e4); color:var(--primary); font-weight:500; }
  .rail-item.active::before { content:""; position:absolute; left:3px; top:9px; width:3px; height:18px; border-radius:2px; background:var(--primary); }
  .rail-item .plug { margin-left:auto; margin-right:8px; font-size:10px; padding:1px 5px; border-radius:8px; background:var(--primary-bg); color:var(--primary); }
  svg.i { width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

  /* sidebar */
  .sidebar { background:var(--e2); border-right:1px solid var(--border); overflow:auto; padding-top:8px; }
  .section { height:26px; display:flex; align-items:center; justify-content:space-between; padding:0 12px;
    border-bottom:1px solid var(--border); color:var(--dim); font-size:10.5px; font-weight:700; letter-spacing:.5px;
    text-transform:uppercase; margin:10px 0 4px; }
  .section button { background:none; border:0; color:var(--dim); cursor:pointer; padding:0 2px; font-size:14px; line-height:1; }
  .section button:hover { color:var(--primary); }
  .sb-item { position:relative; height:32px; margin:1px 0; padding:0 10px 0 16px; display:flex; align-items:center; gap:8px;
    border-radius:var(--radius); cursor:pointer; }
  .sb-item:hover { background:var(--e3); }
  .sb-item.active { background:var(--e4); color:var(--primary); font-weight:500; }
  .sb-item.active::before { content:""; position:absolute; left:6px; top:7px; width:3px; height:18px; border-radius:2px; background:var(--primary); }
  .sb-item .lbl { flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .badge { min-width:22px; height:18px; padding:0 6px; border-radius:9px; background:var(--e4); color:var(--muted);
    font-size:10.5px; font-weight:500; display:inline-flex; align-items:center; justify-content:center; }
  .badge.err { background:rgba(237,66,69,.15); color:var(--danger); }
  .badge.warn { background:rgba(249,168,37,.15); color:var(--warning); }
  .dot { width:9px; height:9px; border-radius:50%; flex:none; }

  /* center */
  .center { display:flex; flex-direction:column; min-width:0; min-height:0; background:var(--e1); }
  .toolbar { display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid var(--border); }
  .search { flex:1; display:flex; align-items:center; gap:8px; height:32px; padding:0 10px; background:var(--e0);
    border:1px solid var(--border); border-radius:var(--radius); color:var(--dim); }
  .search:focus-within { border-color:var(--primary); }
  .search input { flex:1; background:none; border:0; outline:0; color:var(--text); font:inherit; }
  .search kbd { font:10.5px monospace; color:var(--dim); border:1px solid var(--border); border-radius:4px; padding:0 4px; }
  .btn { height:32px; padding:0 11px; display:inline-flex; align-items:center; gap:6px; background:var(--e3);
    border:1px solid var(--border); border-radius:var(--radius); cursor:pointer; white-space:nowrap; }
  .btn:hover { background:var(--e4); }
  .btn.primary { background:var(--primary); border-color:var(--primary); color:#08131b; font-weight:600; }
  .btn.primary:hover { background:#4aa8d8; }
  .btn.ghost { background:none; border-color:transparent; color:var(--muted); padding:0 8px; }
  .btn.ghost:hover { background:var(--e3); color:var(--text); }
  .btn.danger { background:rgba(237,66,69,.15); border-color:transparent; color:var(--danger); }
  .hint { display:flex; align-items:center; gap:8px; padding:6px 12px; font-size:11.5px; color:var(--muted);
    background:var(--primary-bg); border-bottom:1px solid var(--border); }
  .hint b { color:var(--primary); font-weight:500; }
  .hint .x { margin-left:auto; cursor:pointer; color:var(--dim); }

  .tree { flex:1; min-height:0; overflow:auto; padding:6px 6px 16px; user-select:none; }
  .row { height:30px; display:flex; align-items:center; gap:7px; padding-right:10px; border-radius:5px; cursor:default; position:relative; }
  .row:hover { background:var(--e3); }
  .row.sel { background:rgba(102,192,244,.13); }
  .row.sel:hover { background:rgba(102,192,244,.18); }
  .row.drop { outline:1px dashed var(--primary); background:var(--primary-bg); }
  .row.folder { height:32px; font-weight:600; }
  .row.folder.top { margin-top:4px; }
  .row.dim .name { color:var(--muted); }
  .indent { display:flex; align-self:stretch; flex:none; }
  .indent span { width:20px; position:relative; }
  .indent span::before { content:""; position:absolute; left:9px; top:0; bottom:0; border-left:1px solid var(--border); }
  .caret { width:16px; height:16px; display:flex; align-items:center; justify-content:center; color:var(--dim); cursor:pointer; flex:none; transition:transform .12s; }
  .caret.closed { transform:rotate(-90deg); }
  .caret.none { visibility:hidden; }
  .cb { width:16px; height:16px; border-radius:4px; border:1.5px solid #4a505a; background:var(--e3); flex:none;
    display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .cb:hover { border-color:var(--primary); }
  .cb.on { background:var(--primary); border-color:var(--primary); }
  .cb.mixed { background:rgba(102,192,244,.25); border-color:var(--primary); }
  .cb.on::after { content:""; width:8px; height:4px; border:2px solid #08131b; border-top:0; border-right:0; transform:translateY(-1px) rotate(-45deg); }
  .cb.mixed::after { content:""; width:8px; height:2px; border-radius:1px; background:var(--primary); }
  .name { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; min-width:0; }
  .row .count { font-weight:500; }
  .row .auto { font-size:10.5px; font-weight:500; color:var(--warning); background:rgba(249,168,37,.12); padding:1px 6px; border-radius:8px; }
  .row .grow { flex:1; }
  .pkg { color:var(--dim); font:11px ui-monospace,monospace; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:240px; }
  .tag { font-size:10.5px; font-weight:500; padding:1px 7px; border-radius:9px; white-space:nowrap; }
  .prov { width:14px; height:14px; flex:none; }
  .issue { flex:none; width:16px; height:16px; border-radius:50%; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .issue.err { background:rgba(237,66,69,.18); color:var(--danger); }
  .issue.warn { background:rgba(249,168,37,.18); color:var(--warning); }
  .row mark { background:rgba(102,192,244,.28); color:var(--text); border-radius:2px; }
  .row.folder .fic { color:var(--primary); }
  .row.folder.ungrouped .fic { color:var(--dim); }
  .row.folder.ungrouped .name { color:var(--muted); font-style:italic; }
  .empty { padding:40px; text-align:center; color:var(--dim); }

  .selbar { display:none; align-items:center; gap:8px; padding:8px 12px; border-top:1px solid var(--border); background:var(--e2); }
  .selbar.show { display:flex; }
  .selbar .n { color:var(--primary); font-weight:600; margin-right:4px; white-space:nowrap; }

  /* details */
  .details { background:var(--e2); border-left:1px solid var(--border); overflow:auto; padding:16px; }
  .details h2 { margin:0 0 2px; font-size:16px; font-weight:600; }
  .details .sub { color:var(--dim); font:11.5px ui-monospace,monospace; margin-bottom:14px; word-break:break-all; }
  .kv { display:grid; grid-template-columns:90px 1fr; gap:6px 10px; margin:12px 0; font-size:12px; }
  .kv dt { color:var(--dim); } .kv dd { margin:0; }
  .card { background:var(--e3); border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin:12px 0; }
  .card h4 { margin:0 0 8px; font-size:10.5px; letter-spacing:.5px; text-transform:uppercase; color:var(--dim); }
  .stat { display:flex; gap:10px; }
  .stat div { flex:1; background:var(--e2); border-radius:6px; padding:8px; text-align:center; }
  .stat b { display:block; font-size:18px; }
  .stat span { font-size:11px; color:var(--dim); }
  .bar { height:6px; background:var(--e4); border-radius:3px; overflow:hidden; margin-top:10px; }
  .bar i { display:block; height:100%; background:var(--primary); }
  .tags { display:flex; flex-wrap:wrap; gap:6px; }
  .addtag { border:1px dashed var(--border); color:var(--dim); background:none; border-radius:9px; font-size:10.5px; padding:1px 8px; cursor:pointer; }
  .addtag:hover { color:var(--primary); border-color:var(--primary); }
  .note { font-size:11.5px; color:var(--muted); display:flex; gap:8px; }
  .details .btn { width:100%; justify-content:center; margin-top:6px; }

  .statusbar { height:28px; display:flex; align-items:center; gap:16px; padding:0 12px; background:var(--e0);
    border-top:1px solid var(--border); color:var(--dim); font-size:11.5px; }
  .statusbar b { color:var(--muted); font-weight:500; }
  .statusbar .right { margin-left:auto; display:flex; align-items:center; gap:6px; }

  /* menus & dialogs */
  .menu { position:fixed; min-width:210px; background:var(--e3); border:1px solid var(--border); border-radius:8px; padding:4px;
    box-shadow:0 12px 32px rgba(0,0,0,.5); z-index:20; display:none; }
  .menu .mi { height:28px; padding:0 10px; display:flex; align-items:center; gap:8px; border-radius:5px; cursor:pointer; }
  .menu .mi:hover { background:var(--e4); }
  .menu .mi.danger { color:var(--danger); }
  .menu .mi .k { margin-left:auto; color:var(--dim); font-size:11px; }
  .menu .sep { height:1px; background:var(--border); margin:4px 2px; }
  .menu .hdr { padding:4px 10px 2px; font-size:10.5px; color:var(--dim); text-transform:uppercase; letter-spacing:.5px; }
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:30; }
  .overlay.show { display:flex; }
  .dialog { width:560px; max-height:80vh; display:flex; flex-direction:column; background:var(--e2); border:1px solid var(--border); border-radius:10px; box-shadow:0 30px 80px rgba(0,0,0,.6); }
  .dialog.wide { width:860px; }
  .dialog header { padding:14px 16px 4px; font-size:15px; font-weight:600; }
  .dialog .desc { padding:0 16px 10px; color:var(--muted); font-size:12px; }
  .dialog .body { padding:4px 16px 12px; overflow:auto; }
  .dialog footer { display:flex; gap:8px; justify-content:flex-end; padding:12px 16px; border-top:1px solid var(--border); }
  .dialog footer .left { margin-right:auto; color:var(--muted); font-size:12px; align-self:center; }
  .field { width:100%; height:32px; padding:0 10px; background:var(--e0); border:1px solid var(--border); border-radius:6px; color:var(--text); font:inherit; outline:0; }
  .field:focus { border-color:var(--primary); }
  select.field { appearance:none; }
  .rule { display:grid; grid-template-columns:18px 20px 104px 104px 1fr 16px 220px 20px; gap:8px; align-items:center; padding:6px 8px; margin-bottom:6px;
    background:var(--e3); border:1px solid var(--border); border-radius:7px; }
  .rule .grip { color:var(--dim); cursor:grab; letter-spacing:-2px; }
  .rule .num { color:var(--dim); font-size:11px; text-align:center; }
  .rule .arrow { color:var(--dim); text-align:center; }
  .rule .del { color:var(--dim); cursor:pointer; text-align:center; }
  .rule .del:hover { color:var(--danger); }
  .rule .field { height:28px; font-size:12px; }
  .rule .hits { grid-column:3 / -1; font-size:11px; color:var(--dim); margin-top:-2px; }
  .pick { padding:6px 8px; border-radius:6px; cursor:pointer; display:flex; align-items:center; gap:8px; }
  .pick:hover { background:var(--e3); }
  .pick.cur { color:var(--dim); cursor:default; }
  .tagrow { display:flex; align-items:center; gap:10px; padding:6px 8px; border-radius:6px; cursor:pointer; }
  .tagrow:hover { background:var(--e3); }
  .toast { position:fixed; left:50%; bottom:40px; transform:translateX(-50%) translateY(20px); opacity:0; transition:.2s;
    background:var(--e4); border:1px solid var(--border); padding:8px 14px; border-radius:8px; box-shadow:0 10px 30px rgba(0,0,0,.5); z-index:40; }
  .toast.show { opacity:1; transform:translateX(-50%); }
  .toast .undo { color:var(--primary); margin-left:12px; cursor:pointer; font-weight:500; }
</style>
</head>

<script>
const TAG_COLORS = { Combat:"#ed4245", Factions:"#f9a825", Graphics:"#b48ef7", QoL:"#3ba55d", Performance:"#66c0f4", Storyteller:"#e879a6" };

let uid = 0;
const M = (name, pkg, author, prov, on, tags = [], issue = null) => ({ id: "m" + (++uid), name, pkg, author, prov, on, tags, issue });
const mods = [
  M("Core", "ludeon.rimworld", "Ludeon Studios", "core", true),

function matches(m) {
  const ok = {
    all: true, active: m.on, inactive: !m.on, core: m.prov === "core", local: m.prov === "local", steam: m.prov === "steam",
    errors: m.issue?.kind === "err", warnings: m.issue?.kind === "warn",

  if (!ok) return false;

}
const hl = s => { if (!query) return esc(s); const i = s.toLowerCase().indexOf(query.toLowerCase()); return i < 0 ? esc(s) : esc(s.slice(0, i)) + "<mark>" + esc(s.slice(i, i + query.length)) + "</mark>" + esc(s.slice(i + query.length)); };

/* ── tree ── */
function buildRows() {
  const rows = [];
  const pushFolder = (f, d) => {
    const all = descMods(f), vis = all.filter(i => matches(byId[i]));
    if (filtering() && !vis.length) return;
    rows.push({ type: "folder", f, d, all, vis });
    if (f.collapsed && !filtering()) return;
    if (!f.virtual) childrenOf(f).forEach(c => pushFolder(c, d + 1));
    const own = f.virtual ? all : f.mods;
    own.filter(i => matches(byId[i])).forEach(i => rows.push({ type: "mod", m: byId[i], d: d + 1 }));
  };
  folders.filter(f => !f.parent).forEach(f => pushFolder(f, 0));
  pushFolder(UNGROUPED, 0);
  return rows;
}

  $("#tree").innerHTML = rows.length ? rows.map(r => {
    if (r.type === "folder") {

      const errs = all.filter(i => byId[i].issue?.kind === "err").length;
      return `<div class="row folder ${d === 0 ? "top" : ""} ${f.virtual ? "ungrouped" : ""} ${focusFolder === f.id ? "sel" : ""}" data-folder="${f.id}">

        <span class="name">${esc(f.name)}</span>
        <span class="badge count" title="active / total">${filtering() ? `${vis.length} of ${all.length}` : `${on}/${all.length}`}</span>
        ${errs ? `<span class="badge err">${errs} ${errs > 1 ? "errors" : "error"}</span>` : ""}
        ${f.auto ? `<span class="auto" title="Has auto-assign rule">${"⚡"} auto</span>` : ""}
        <span class="grow"></span></div>`;
    }
    const m = r.m;
    return `<div class="row mod ${m.on ? "" : "dim"} ${selected.has(m.id) ? "sel" : ""}" data-mod="${m.id}" draggable="true">
      ${indent(r.d)}<span class="caret none"></span>
      <span class="cb ${m.on ? "on" : ""}" data-act="mcheck"></span>
      ${provIcon(m.prov)}<span class="name">${hl(m.name)}</span>

  }).join("") : `<div class="empty">No mods match “${esc(query)}”</div>`;
}

/* ── actions ── */
function snapshot() { return { on: mods.map(m => m.on), tags: mods.map(m => [...m.tags]), f: JSON.parse(JSON.stringify(folders)) }; }
function restore(s) { mods.forEach((m, i) => { m.on = s.on[i]; m.tags = s.tags[i]; }); folders.splice(0, folders.length, ...s.f); render(); }
function setMods(ids, on, msg) { const s = snapshot(); ids.forEach(i => byId[i].on = on); render(); if (msg) toast(msg, s); }
function moveMods(ids, targetId, msg) {
  const s = snapshot();
  ids.forEach(i => { const f = folderOf(i); if (f) f.mods = f.mods.filter(x => x !== i); });
  if (targetId && targetId !== "ungrouped") folders.find(x => x.id === targetId).mods.push(...ids);
  render(); toast(msg, s);
}
let toastTimer;
function toast(msg, undo) {
  const t = $("#toast"); lastUndo = undo;
  t.innerHTML = esc(msg) + (undo ? '<span class="undo">Undo</span>' : "");
  t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 3500);
}
$("#toast").addEventListener("click", e => { if (e.target.classList.contains("undo") && lastUndo) { restore(lastUndo); lastUndo = null; $("#toast").classList.remove("show"); } });

$("#tree").addEventListener("click", e => {
  const row = e.target.closest(".row"); if (!row) return;
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (row.dataset.folder) {
    const f = row.dataset.folder === "ungrouped" ? UNGROUPED : folders.find(x => x.id === row.dataset.folder);
    if (act === "toggle") { f.collapsed = !f.collapsed; return render(); }
    if (act === "fcheck") { const all = descMods(f); const turnOn = cbState(all) !== "on"; return setMods(all, turnOn, `${turnOn ? "Enabled" : "Disabled"} ${all.length} mods in “${f.name}”`); }
    selected.clear(); focusFolder = f.id; return render();
  }
  const id = row.dataset.mod;
  if (act === "mcheck") { byId[id].on = !byId[id].on; return render(); }
  focusFolder = null;
  if (e.shiftKey && anchor) {
    const a = visibleModIds.indexOf(anchor), b = visibleModIds.indexOf(id);
    visibleModIds.slice(Math.min(a, b), Math.max(a, b) + 1).forEach(i => selected.add(i));
  } else if (e.ctrlKey || e.metaKey) { selected.has(id) ? selected.delete(id) : selected.add(id); anchor = id; }
  else { selected.clear(); selected.add(id); anchor = id; }
  render();
});
$("#tree").addEventListener("dblclick", e => {
  const row = e.target.closest(".row.folder"); if (!row || e.target.closest("[data-act]")) return;
  const f = row.dataset.folder === "ungrouped" ? UNGROUPED : folders.find(x => x.id === row.dataset.folder);

});

$("#tree").addEventListener("dragover", e => {
  const row = e.target.closest(".row.folder"); document.querySelectorAll(".row.drop").forEach(r => r !== row && r.classList.remove("drop"));
  if (!row) return; e.preventDefault(); row.classList.add("drop");
});
$("#tree").addEventListener("drop", e => {
  const row = e.target.closest(".row.folder"); if (!row) return; e.preventDefault();
  const tid = row.dataset.folder, name = tid === "ungrouped" ? "Ungrouped" : pathOf(folders.find(x => x.id === tid));
  moveMods(dragIds, tid, `Moved ${dragIds.length} ${dragIds.length > 1 ? "mods" : "mod"} to “${name}”`);
});

/* context menu */
const menu = $("#menu");
function openMenu(x, y, items) {
  menu.innerHTML = items.map(it => it === "-" ? '<div class="sep"></div>' : it.hdr ? `<div class="hdr">${esc(it.hdr)}</div>`
    : `<div class="mi ${it.danger ? "danger" : ""}" data-i="${items.indexOf(it)}">${it.icon ? icon(it.icon) : '<span style="width:16px"></span>'}${esc(it.label)}${it.k ? `<span class="k">${it.k}</span>` : ""}</div>`).join("");
  menu.style.display = "block";
  menu.style.left = Math.min(x, innerWidth - menu.offsetWidth - 8) + "px";
  menu.style.top = Math.min(y, innerHeight - menu.offsetHeight - 8) + "px";
  menu.onclick = ev => { const i = ev.target.closest(".mi")?.dataset.i; if (i == null) return; menu.style.display = "none"; items[i].run(); };
}
document.addEventListener("click", e => { if (!menu.contains(e.target)) menu.style.display = "none"; });
$("#tree").addEventListener("contextmenu", e => {
  const row = e.target.closest(".row"); if (!row) return; e.preventDefault();
  if (row.dataset.mod) {
    const id = row.dataset.mod; if (!selected.has(id)) { selected.clear(); selected.add(id); focusFolder = null; render(); }
    const ids = [...selected], n = ids.length, m = byId[id], inFolder = ids.some(folderOf);
    openMenu(e.clientX, e.clientY, [
      { hdr: n > 1 ? `${n} mods` : m.name },
      { icon: "check", label: ids.every(i => byId[i].on) ? "Disable" : "Enable", k: "Space", run: () => { const on = !ids.every(i => byId[i].on); setMods(ids, on); } },
      "-",
      { icon: "folder", label: "Move to folder…", run: () => moveDialog(ids) },
      ...(inFolder ? [{ icon: "inbox", label: "Remove from folder", run: () => moveMods(ids, null, `Moved ${n} to Ungrouped`) }] : []),
      { icon: "folder-plus", label: "Create folder from selection…", run: () => newFolderDialog(ids) },
      { icon: "tag", label: "Manage tags…", run: () => tagsDialog(ids) },
      "-",
      { icon: "list", label: "Show in load order", run: () => toast("Switches to Mods view and scrolls to the mod in load order") },
    ]);
  } else {
    const fidv = row.dataset.folder;
    if (fidv === "ungrouped") return openMenu(e.clientX, e.clientY, [
      { hdr: "Ungrouped" }, { icon: "bolt", label: "Auto-assign with rules…", run: rulesDialog },
      { icon: "check", label: "Enable all", run: () => setMods(ungroupedMods(), true, "Enabled all ungrouped mods") },
      { icon: "off", label: "Disable all", run: () => setMods(ungroupedMods(), false, "Disabled all ungrouped mods") },
    ]);
    const f = folders.find(x => x.id === fidv);
    focusFolder = f.id; selected.clear(); render();
    openMenu(e.clientX, e.clientY, [
      { hdr: pathOf(f) },
      { icon: "check", label: "Enable all", run: () => setMods(descMods(f), true, `Enabled all in “${f.name}”`) },
      { icon: "off", label: "Disable all", run: () => setMods(descMods(f), false, `Disabled all in “${f.name}”`) },
      "-",
      { icon: "folder", label: "Rename…", k: "F2", run: () => renameDialog(f) },
      ...(f.parent ? [] : [{ icon: "folder-plus", label: "New subfolder…", run: () => newFolderDialog([], f.id) }]),
      { icon: "list", label: "Sort by name", run: () => { f.mods.sort((a, b) => byId[a].name.localeCompare(byId[b].name)); render(); toast(`Sorted “${f.name}” by name`); } },
      { icon: "bolt", label: "Edit auto-rules…", run: rulesDialog },
      "-",
      { icon: "err", label: "Delete folder", danger: true, k: "Del", run: () => deleteFolder(f) },
    ]);
  }
});

/* dialogs */
function dialog(title, desc, body, buttons, left = "", wide = false) {
  $("#dialog").className = "dialog" + (wide ? " wide" : "");
  $("#dialog").innerHTML = `<header>${title}</header>${desc ? `<div class="desc">${desc}</div>` : ""}<div class="body">${body}</div>
    <footer>${left ? `<span class="left">${left}</span>` : ""}${buttons.map((b, i) => `<button class="btn ${b.cls || ""}" data-b="${i}">${b.label}</button>`).join("")}</footer>`;
  $("#overlay").classList.add("show");
  $("#dialog").querySelector("footer").onclick = e => { const i = e.target.closest("[data-b]")?.dataset.b; if (i == null) return; if (buttons[i].run?.() !== false) closeDialog(); };
  setTimeout(() => $("#dialog").querySelector("input.field")?.focus(), 0);
}
const closeDialog = () => $("#overlay").classList.remove("show");
$("#overlay").addEventListener("mousedown", e => { if (e.target.id === "overlay") closeDialog(); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeDialog(); menu.style.display = "none"; }
  if ((e.ctrlKey || e.metaKey) && e.key === "f") { e.preventDefault(); $("#search").focus(); }
});

function folderPicker(current) {
  const opt = (f, d) => `<div class="pick ${current === f.id ? "cur" : ""}" data-f="${f.id}" style="padding-left:${8 + d * 20}px">${icon("folder")}${esc(f.name)}<span class="badge" style="margin-left:auto">${descMods(f).length}</span></div>`;
  return folders.filter(f => !f.parent).map(f => opt(f, 0) + childrenOf(f).map(c => opt(c, 1)).join("")).join("")
    + `<div class="pick" data-f="ungrouped" style="color:var(--muted)">${icon("inbox")}Ungrouped (remove from folder)</div>`
    + `<div class="pick" data-f="__new" style="color:var(--primary)">${icon("folder-plus")}New folder…</div>`;
}
function moveDialog(ids) {
  const cur = ids.length === 1 ? folderOf(ids[0])?.id : null;
  dialog(`Move ${ids.length > 1 ? ids.length + " mods" : "“" + esc(byId[ids[0]].name) + "”"} to folder`, "A mod belongs to at most one folder.", folderPicker(cur), [{ label: "Cancel" }]);
  $("#dialog .body").onclick = e => {
    const p = e.target.closest(".pick"); if (!p || p.classList.contains("cur")) return;
    closeDialog();
    if (p.dataset.f === "__new") return newFolderDialog(ids);
    const name = p.dataset.f === "ungrouped" ? "Ungrouped" : pathOf(folders.find(x => x.id === p.dataset.f));
    moveMods(ids, p.dataset.f, `Moved ${ids.length} to “${name}”`);
  };
}
function newFolderDialog(ids = [], parent = null) {
  const parents = folders.filter(f => !f.parent);
  dialog(parent ? "New subfolder" : ids.length ? `Create folder from ${ids.length} mods` : "New folder",
    ids.length ? "Selected mods will be moved out of their current folders." : "Only one level of subfolders is supported.",
    `<input class="field" id="fname" placeholder="Folder name" value="${ids.length ? esc(guessName(ids)) : ""}">
     <div style="margin-top:10px;display:flex;align-items:center;gap:8px;color:var(--muted)">Inside
     <select class="field" id="fparent" style="width:auto;flex:1"><option value="">— top level —</option>${parents.map(p => `<option value="${p.id}" ${p.id === parent ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select></div>`,
    [{ label: "Cancel" }, { label: "Create", cls: "primary", run: () => {
      const name = $("#fname").value.trim(); if (!name) return false;
      const s = snapshot();
      ids.forEach(i => { const f = folderOf(i); if (f) f.mods = f.mods.filter(x => x !== i); });
      const nf = { id: "f" + (++fid), name, parent: $("#fparent").value || null, collapsed: false, mods: [...ids] };
      folders.push(nf); selected.clear(); focusFolder = nf.id; render(); toast(`Created folder “${name}”`, s);
    } }]);
}
function guessName(ids) {
  const words = ids.map(i => byId[i].name.split(/[\s:-]+/)[0]);
  return words.every(w => w === words[0]) ? words[0] : "";
}
function renameDialog(f) {
  dialog("Rename folder", "", `<input class="field" id="fname" value="${esc(f.name)}">`,
    [{ label: "Cancel" }, { label: "Rename", cls: "primary", run: () => { const v = $("#fname").value.trim(); if (!v) return false; f.name = v; render(); } }]);
}
function deleteFolder(f) {
  const n = descMods(f).length, subs = childrenOf(f).length;
  dialog(`Delete “${esc(f.name)}”?`, `${n} mods${subs ? ` and ${subs} subfolders` : ""} will become <b>Ungrouped</b>. Mods are not uninstalled or disabled.`, "",
    [{ label: "Cancel" }, { label: "Delete folder", cls: "danger", run: () => {
      const s = snapshot();
      const kill = new Set([f.id, ...childrenOf(f).map(c => c.id)]);
      folders.splice(0, folders.length, ...folders.filter(x => !kill.has(x.id)));
      focusFolder = null; render(); toast(`Deleted folder “${f.name}”`, s);
    } }]);
}
function tagsDialog(ids) {
  const state = t => { const n = ids.filter(i => byId[i].tags.includes(t)).length; return n === 0 ? "" : n === ids.length ? "on" : "mixed"; };
  const draw = () => Object.keys(TAG_COLORS).map(t => `<div class="tagrow" data-t="${esc(t)}"><span class="cb ${state(t)}"></span><span class="dot" style="background:${TAG_COLORS[t]}"></span>${esc(t)}<span class="badge" style="margin-left:auto">${mods.filter(m => m.tags.includes(t)).length}</span></div>`).join("")
    + `<div style="display:flex;gap:8px;margin-top:10px"><input class="field" id="newtag" placeholder="New tag…"><button class="btn" id="addtag">Add</button></div>`;
  const s = snapshot();
  dialog(`Tags — ${ids.length > 1 ? ids.length + " mods" : esc(byId[ids[0]].name)}`, "A mod can have any number of tags. Tags appear in the sidebar as filters.", draw(),
    [{ label: "Cancel", run: () => restore(s) }, { label: "Done", cls: "primary", run: render }]);
  const body = $("#dialog .body");
  body.onclick = e => {
    if (e.target.id === "addtag") {
      const v = $("#newtag").value.trim(); if (!v) return;
      TAG_COLORS[v] ??= ["#5eead4", "#fb923c", "#a3e635", "#c084fc"][Object.keys(TAG_COLORS).length % 4];
      ids.forEach(i => byId[i].tags.includes(v) || byId[i].tags.push(v)); body.innerHTML = draw(); return;
    }
    const r = e.target.closest(".tagrow"); if (!r) return;
    const t = r.dataset.t, add = state(t) !== "on";
    ids.forEach(i => { const m = byId[i]; m.tags = m.tags.filter(x => x !== t); if (add) m.tags.push(t); });
    body.innerHTML = draw();
  };
}
function newTagDialog() {
  dialog("New tag", "Tags can be assigned from the mod context menu.", `<input class="field" id="tname" placeholder="e.g. Medieval">`,
    [{ label: "Cancel" }, { label: "Create", cls: "primary", run: () => { const v = $("#tname").value.trim(); if (!v) return false; TAG_COLORS[v] ??= "#5eead4"; render(); } }]);
}

function ruleMatches(r, m) { const s = r.field === "pkg" ? m.pkg : r.field === "author" ? m.author.toLowerCase() : m.name.toLowerCase(); const v = r.value.toLowerCase(); return r.op === "starts" ? s.startsWith(v) : s.includes(v); }
function rulesDialog() {
  const folderNames = folders.flatMap(f => f.parent ? [] : [f, ...childrenOf(f)]).map(pathOf);
  const draw = () => rules.map((r, i) => {
    const hits = mods.filter(m => rules.findIndex(x => ruleMatches(x, m)) === i).length;
    return `<div class="rule" data-i="${i}"><span class="grip">⋮⋮</span><span class="num">${i + 1}</span>
      <select class="field" data-k="field"><option value="pkg" ${r.field === "pkg" ? "selected" : ""}>packageId</option><option value="name" ${r.field === "name" ? "selected" : ""}>name</option><option value="author" ${r.field === "author" ? "selected" : ""}>author</option></select>
      <select class="field" data-k="op"><option value="starts" ${r.op === "starts" ? "selected" : ""}>starts with</option><option value="contains" ${r.op === "contains" ? "selected" : ""}>contains</option></select>
      <input class="field" data-k="value" value="${esc(r.value)}">
      <span class="arrow">→</span>
      <select class="field" data-k="folder">${folderNames.map(n => `<option ${n === r.folder ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>
      <span class="del" data-del="${i}">✕</span>
      <div class="hits">${hits} ${hits === 1 ? "mod matches" : "mods match"}${hits ? " first here" : ""}</div></div>`;
  }).join("") + `<button class="btn ghost" id="addRule" style="margin-top:4px">+ Add rule</button>`;
  const pending = () => ungroupedMods().filter(i => rules.some(r => ruleMatches(r, byId[i]))).length;
  const orig = JSON.parse(JSON.stringify(rules));
  dialog("Auto-folder rules", "Evaluated top to bottom — <b>first match wins</b>. Rules only assign mods that are still ungrouped; manual moves are never overridden.",
    draw(), [{ label: "Cancel", run: () => { rules = orig; } }, { label: "Save", cls: "", run: () => toast("Rules saved") },
      { label: "Save & apply", cls: "primary", run: () => {
        const s = snapshot(); let n = 0;
        ungroupedMods().forEach(i => { const r = rules.find(x => ruleMatches(x, byId[i])); if (!r) return; const f = folders.find(x => pathOf(x) === r.folder); if (f) { f.mods.push(i); n++; } });
        render(); toast(`Auto-assigned ${n} ungrouped mods`, s);
      } }], `${pending()} ungrouped mods would be assigned`, true);
  const body = $("#dialog .body"), refresh = () => { body.innerHTML = draw(); $("#dialog .left").textContent = `${pending()} ungrouped mods would be assigned`; };
  body.onchange = body.oninput = e => { const k = e.target.dataset.k; if (!k) return; rules[e.target.closest(".rule").dataset.i][k] = e.target.value; if (e.type === "change") refresh(); else $("#dialog .left").textContent = `${pending()} ungrouped mods would be assigned`; };
  body.onclick = e => {
    if (e.target.dataset.del != null) { rules.splice(+e.target.dataset.del, 1); refresh(); }
    if (e.target.id === "addRule") { rules.push({ field: "name", op: "contains", value: "", folder: folderNames[0] }); refresh(); }
  };
}

/* toolbar */
$("#search").addEventListener("input", e => { query = e.target.value.trim(); render(); });
$("#newFolder").onclick = () => newFolderDialog(selected.size ? [...selected] : []);
$("#rulesBtn").onclick = rulesDialog;
$("#expandAll").onclick = () => { folders.forEach(f => f.collapsed = false); UNGROUPED.collapsed = false; render(); };
$("#collapseAll").onclick = () => { folders.forEach(f => f.collapsed = true); UNGROUPED.collapsed = true; render(); };

/* initial state: a folder focused to show details pane */
focusFolder = ve.id;
render();
</script>
</body>
</html>
