name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: '6.10.3'
  QCORO_REF: 'v0.13.0'

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        workshop: [NoWorkshop, SteamWorkshop, NativeWorkshop]
    env:
      VARIANT: ${{ matrix.workshop }}
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          modules: ${{ matrix.workshop == 'SteamWorkshop' && 'qtshadertools qtpositioning qtwebchannel qtwebengine' || 'qtshadertools' }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install system dependencies
        run: |
          # GCC 13 provides C++23 <expected> while Jammy preserves glibc 2.35.
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 ninja-build ccache dpkg patchelf rpm file libfuse2 libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libpugixml-dev libzip-dev zipcmp zipmerge ziptool libspdlog-dev

      - name: Build QCoro against Qt
        shell: bash
        run: |
          git clone --depth 1 --branch "$QCORO_REF" https://github.com/qcoro/qcoro.git "$RUNNER_TEMP/qcoro-src"
          cmake -S "$RUNNER_TEMP/qcoro-src" -B "$RUNNER_TEMP/qcoro-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/qcoro" \
            -DUSE_QT_VERSION=6 \
            -DQCORO_WITH_QTDBUS=OFF \
            -DQCORO_WITH_QTWEBSOCKETS=OFF \
            -DQCORO_BUILD_EXAMPLES=OFF \
            -DBUILD_TESTING=OFF
          cmake --build "$RUNNER_TEMP/qcoro-build"
          cmake --install "$RUNNER_TEMP/qcoro-build"

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: release-linux-${{ matrix.workshop }}

      - name: Build injected JavaScript
        run: just build-js

      - name: Configure
        shell: bash
        run: |
          cmake --preset release \
            -DPX_WORKSHOP_VARIANT="$VARIANT" \
            -DPX_BUILD_TESTS=OFF \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$RUNNER_TEMP/qcoro"

      - name: Build
        run: cmake --build --preset release

      - name: Install into AppDir
        run: cmake --install build/release --prefix "$PWD/dist/AppDir/usr"

      - name: Verify glibc floor
        run: |
          set -euo pipefail
          max=$(find dist/AppDir/usr -type f \( -name '*.so*' -o -perm -u+x \) -exec objdump -T {} + 2>/dev/null \
            | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1 || true)
          echo "Highest GLIBC symbol: ${max:-none}"
          test -n "$max"
          test "$(printf '%s\nGLIBC_2.35\n' "$max" | sort -V | tail -1)" = "GLIBC_2.35"

      - name: Deploy Qt and build AppImage
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"
          curl -fsSL -o "$tools/linuxdeploy" https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o "$tools/linuxdeploy-plugin-qt" https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x "$tools/linuxdeploy" "$tools/linuxdeploy-plugin-qt"
          cp src/ui/assets/logo.svg dist/pxmodrim.svg
          # Only SQLite is used; other drivers require external database clients.
          find "$QT_ROOT_DIR/plugins/sqldrivers" -type f ! -name libqsqlite.so -delete
          export PATH="$tools:$PATH" APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64
          export QMAKE="$QT_ROOT_DIR/bin/qmake" QML_SOURCES_PATHS="$PWD/src/ui"
          export OUTPUT="$PWD/dist/PxModRim-Linux-x86_64-$VARIANT.AppImage"
          linuxdeploy --appdir dist/AppDir \
            --executable dist/AppDir/usr/bin/pxmodrim \
            --desktop-file dist/AppDir/usr/share/applications/pxmodrim.desktop \
            --icon-file dist/pxmodrim.svg \
            --plugin qt \
            --output appimage
          tar -czf "dist/PxModRim-Linux-$VARIANT.tar.gz" -C dist/AppDir usr

      - name: Build deb and rpm
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=//p' build/release/CMakeCache.txt)
          fi

          pkg=dist/deb
          rm -rf "$pkg"
          mkdir -p "$pkg/DEBIAN" "$pkg/opt/pxmodrim" "$pkg/usr/bin" \
            "$pkg/usr/share/applications" "$pkg/usr/share/icons/hicolor/scalable/apps"
          cp -a dist/AppDir/usr/. "$pkg/opt/pxmodrim/"
          ln -s /opt/pxmodrim/bin/pxmodrim "$pkg/usr/bin/pxmodrim"
          install -m 644 packaging/linux/pxmodrim.desktop "$pkg/usr/share/applications/pxmodrim.desktop"
          install -m 644 src/ui/assets/logo.svg "$pkg/usr/share/icons/hicolor/scalable/apps/pxmodrim.svg"
          installed_size=$(du -sk "$pkg" | cut -f1)
          cat > "$pkg/DEBIAN/control" <<EOF
          Package: pxmodrim
          Version: $version
          Section: games
          Priority: optional
          Architecture: amd64
          Installed-Size: $installed_size
          Maintainer: PyXiion
          Homepage: https://github.com/PyXiion/PxModRim
          Description: Mod manager for RimWorld
           PxModRim is a fast and modern mod manager for RimWorld.
          EOF
          dpkg-deb --build --root-owner-group "$pkg" "dist/pxmodrim_${version}_amd64-$VARIANT.deb"
          rm -rf "$pkg"

          rpmbuild -bb \
            --define "_topdir $PWD/dist/rpmbuild" \
            --define "project_root $PWD" \
            --define "version $version" \
            packaging/linux/pxmodrim.spec
          for rpm in dist/rpmbuild/RPMS/*/*.rpm; do
            mv "$rpm" "dist/$(basename "${rpm%.rpm}")-$VARIANT.rpm"
          done
          rm -rf dist/rpmbuild

      - name: Upload artifact (tar.gz)
        uses: actions/upload-artifact@v7
        with:
          name: PxModRim-Linux-${{ matrix.workshop }}
          path: dist/PxModRim-Linux-${{ matrix.workshop }}.tar.gz

      - name: Upload artifact (AppImage)
        uses: actions/upload-artifact@v7
        with:
          name: PxModRim-Linux-AppImage-${{ matrix.workshop }}
          path: dist/PxModRim-Linux-x86_64-${{ matrix.workshop }}.AppImage

      - name: Upload artifact (deb)
        uses: actions/upload-artifact@v7
        with:
          name: PxModRim-Linux-Deb-${{ matrix.workshop }}
          path: dist/*-${{ matrix.workshop }}.deb

      - name: Upload artifact (rpm)
        uses: actions/upload-artifact@v7
        with:
          name: PxModRim-Linux-RPM-${{ matrix.workshop }}
          path: dist/*-${{ matrix.workshop }}.rpm

  build-flatpak:
    needs: [build-linux]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workshop: [NoWorkshop, SteamWorkshop, NativeWorkshop]
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Download Linux dist
        uses: actions/download-artifact@v8
        with:
          name: PxModRim-Linux-${{ matrix.workshop }}
          path: dist-archive

      - name: Extract Linux dist
        run: |
          mkdir -p dist
          tar -xzf dist-archive/PxModRim-Linux-${{ matrix.workshop }}.tar.gz -C dist

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/com.github.PyXiion.PxModRim.yaml
          bundle: PxModRim-Linux-${{ matrix.workshop }}.flatpak
          build-bundle: true
          upload-artifact: true
          artifact-name: PxModRim-Flatpak-${{ matrix.workshop }}

  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        workshop: [NoWorkshop, SteamWorkshop, NativeWorkshop]
    env:
      VARIANT: ${{ matrix.workshop }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          modules: ${{ matrix.workshop == 'SteamWorkshop' && 'qtshadertools qtpositioning qtwebchannel qtwebengine' || 'qtshadertools' }}

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install dependencies
        shell: pwsh
        run: |
          choco install ninja ccache --yes --no-progress
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install pugixml libzip spdlog --triplet x64-windows-static-md
          choco install nsis --version=3.11 --yes --no-progress
          $nsisDir = Join-Path ${env:ProgramFiles(x86)} "NSIS"
          $makensis = Join-Path $nsisDir "makensis.exe"
          if (-not (Test-Path $makensis)) {
            throw "NSIS installation did not provide makensis.exe"
          }
          $nsisDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $makensis /VERSION

      - name: Build QCoro against Qt
        shell: bash
        run: |
          git clone --depth 1 --branch "$QCORO_REF" https://github.com/qcoro/qcoro.git "$RUNNER_TEMP/qcoro-src"
          cmake -S "$RUNNER_TEMP/qcoro-src" -B "$RUNNER_TEMP/qcoro-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/qcoro" \
            -DUSE_QT_VERSION=6 \
            -DQCORO_WITH_QTDBUS=OFF \
            -DQCORO_WITH_QTWEBSOCKETS=OFF \
            -DQCORO_BUILD_EXAMPLES=OFF \
            -DBUILD_TESTING=OFF
          cmake --build "$RUNNER_TEMP/qcoro-build"
          cmake --install "$RUNNER_TEMP/qcoro-build"

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: release-windows-${{ matrix.workshop }}

      - name: Build injected JavaScript
        run: just build-js

      - name: Configure
        shell: bash
        run: |
          cmake --preset release \
            -DPX_WORKSHOP_VARIANT="$VARIANT" \
            -DPX_BUILD_TESTS=OFF \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$RUNNER_TEMP/qcoro" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md

      - name: Build
        run: cmake --build --preset release

      - name: Install
        shell: bash
        run: |
          set -euo pipefail
          cmake --install build/release --prefix "$PWD/dist/PxModRim"
          mv dist/PxModRim/bin/pxmodrim.exe dist/PxModRim/bin/PxModRim.exe

      - name: Deploy Qt
        shell: bash
        run: |
          set -euo pipefail
          windeployqt --release --no-translations --qmldir src/ui dist/PxModRim/bin/PxModRim.exe
          if [ -d dist/PxModRim/bin/qtwebengine_locales ]; then
            find dist/PxModRim/bin/qtwebengine_locales -name '*.pak' ! -name 'en-US.pak' ! -name 'en-GB.pak' -delete
          fi
          rm -f dist/PxModRim/bin/qtwebengine_devtools_resources.pak

      - name: Build NSIS installer and zip
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $version = (Select-String '^CMAKE_PROJECT_VERSION:STATIC=' build/release/CMakeCache.txt).Line.Split('=')[1]
          }
          makensis.exe "/DVERSION=$version" "/DDIST_DIR=$PWD/dist/PxModRim/bin" `
            "/DOUTPUT_FILE=$PWD/dist/PxModRim-Windows-$env:VARIANT-Setup.exe" packaging/windows/installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          7z a "dist/PxModRim-Windows-$env:VARIANT.zip" "./dist/PxModRim/bin/*"

      - name: Upload artifact (dist)
        uses: actions/upload-artifact@v7
        with:
          name: PxModRim-Windows-${{ matrix.workshop }}
          path: dist/PxModRim-Windows-${{ matrix.workshop }}.zip

      - name: Upload artifact (installer)
        uses: actions/upload-artifact@v7
        with:
          name: PxModRim-Windows-Installer-${{ matrix.workshop }}
          path: dist/PxModRim-Windows-${{ matrix.workshop }}-Setup.exe

  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        workshop: [NoWorkshop, SteamWorkshop, NativeWorkshop]
    env:
      VARIANT: ${{ matrix.workshop }}
      MACOS_SIGNING_CONFIGURED: >-
        ${{ secrets.MACOS_CERT != '' &&
            secrets.MACOS_CERT_PASSWORD != '' &&
            secrets.MACOS_SIGNING_IDENTITY != '' &&
            secrets.APPLE_ID != '' &&
            secrets.APPLE_TEAM_ID != '' &&
            secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          modules: ${{ matrix.workshop == 'SteamWorkshop' && 'qtshadertools qtpositioning qtwebchannel qtwebengine' || 'qtshadertools' }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install dependencies
        run: brew install ninja ccache pugixml libzip spdlog dylibbundler

      - name: Build QCoro against Qt
        shell: bash
        run: |
          git clone --depth 1 --branch "$QCORO_REF" https://github.com/qcoro/qcoro.git "$RUNNER_TEMP/qcoro-src"
          cmake -S "$RUNNER_TEMP/qcoro-src" -B "$RUNNER_TEMP/qcoro-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/qcoro" \
            -DUSE_QT_VERSION=6 \
            -DQCORO_WITH_QTDBUS=OFF \
            -DQCORO_WITH_QTWEBSOCKETS=OFF \
            -DQCORO_BUILD_EXAMPLES=OFF \
            -DBUILD_TESTING=OFF
          cmake --build "$RUNNER_TEMP/qcoro-build"
          cmake --install "$RUNNER_TEMP/qcoro-build"

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: release-macos-${{ matrix.workshop }}

      - name: Build injected JavaScript
        run: just build-js

      - name: Configure
        shell: bash
        run: |
          cmake --preset release \
            -DPX_WORKSHOP_VARIANT="$VARIANT" \
            -DPX_BUILD_TESTS=OFF \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$RUNNER_TEMP/qcoro"

      - name: Build
        run: cmake --build --preset release

      - name: Install and deploy Qt
        shell: bash
        run: |
          set -euo pipefail
          cmake --install build/release --prefix "$PWD/dist/stage"
          mv dist/stage/pxmodrim.app dist/PxModRim.app
          rm -rf dist/stage
          macdeployqt dist/PxModRim.app -qmldir=src/ui -always-overwrite
          mkdir -p dist/PxModRim.app/Contents/Frameworks
          dylibbundler -od -b -x dist/PxModRim.app/Contents/MacOS/pxmodrim \
            -d dist/PxModRim.app/Contents/Frameworks/ -p @executable_path/../Frameworks/

      - name: Sign and notarize macOS app
        if: env.MACOS_SIGNING_CONFIGURED == 'true'
        env:
          MACOS_CERT: ${{ secrets.MACOS_CERT }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          keychain_password="$(openssl rand -hex 24)"
          keychain_path="$RUNNER_TEMP/pxmodrim-signing.keychain-db"
          certificate="$RUNNER_TEMP/pxmodrim-signing.p12"
          notary_zip="$RUNNER_TEMP/PxModRim-notarize.zip"
          printf '%s' "$MACOS_CERT" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate" \
            -f pkcs12 \
            -P "$MACOS_CERT_PASSWORD" \
            -k "$keychain_path" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          codesign --force --deep --options runtime --timestamp \
            --sign "$MACOS_SIGNING_IDENTITY" dist/PxModRim.app
          codesign --verify --deep --strict dist/PxModRim.app
          ditto -c -k --keepParent dist/PxModRim.app "$notary_zip"
          xcrun notarytool submit "$notary_zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple dist/PxModRim.app
          rm -f dist/PxModRim-macOS.zip dist/PxModRim-macOS.dmg
          ditto -c -k --keepParent dist/PxModRim.app dist/PxModRim-macOS.zip
          hdiutil create -volname PxModRim \
            -srcfolder dist/PxModRim.app \
            -ov -format UDZO dist/PxModRim-macOS.dmg
          xcrun notarytool submit dist/PxModRim-macOS.dmg \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple dist/PxModRim-macOS.dmg
          security delete-keychain "$keychain_path"
          rm -f "$certificate" "$notary_zip"

      - name: Ad-hoc sign and archive macOS app
        if: env.MACOS_SIGNING_CONFIGURED != 'true'
        run: |
          set -euo pipefail
          codesign --force --deep --sign - dist/PxModRim.app
          ditto -c -k --keepParent dist/PxModRim.app dist/PxModRim-macOS.zip
          hdiutil create -volname PxModRim \
            -srcfolder dist/PxModRim.app \
            -ov -format UDZO dist/PxModRim-macOS.dmg

      - name: Rename macOS packages
        run: |
          set -euo pipefail
          mv dist/PxModRim-macOS.zip "dist/PxModRim-macOS-$VARIANT.zip"
          mv dist/PxModRim-macOS.dmg "dist/PxModRim-macOS-$VARIANT.dmg"

      - name: Upload artifact (dmg)
        uses: actions/upload-artifact@v7
        with:
          name: PxModRim-macOS-DMG-${{ matrix.workshop }}
          path: dist/PxModRim-macOS-${{ matrix.workshop }}.dmg

      - name: Upload artifact (zip)
        uses: actions/upload-artifact@v7
        with:
          name: PxModRim-macOS-ZIP-${{ matrix.workshop }}
          path: dist/PxModRim-macOS-${{ matrix.workshop }}.zip

  release:
    needs: [build-linux, build-flatpak, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: PxModRim-*
          path: artifacts
          merge-multiple: false

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/PxModRim-Linux-*/*.tar.gz
            artifacts/PxModRim-Linux-AppImage-*/*.AppImage
            artifacts/PxModRim-Linux-Deb-*/*.deb
            artifacts/PxModRim-Linux-RPM-*/*.rpm
            artifacts/PxModRim-Flatpak-*/*.flatpak
            artifacts/PxModRim-Windows-*/*.zip
            artifacts/PxModRim-Windows-Installer-*/*-Setup.exe
            artifacts/PxModRim-macOS-DMG-*/*.dmg
            artifacts/PxModRim-macOS-ZIP-*/*.zip
          generate_release_notes: true
