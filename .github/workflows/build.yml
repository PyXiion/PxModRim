name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@main
        with:
          python-version-file: pyproject.toml

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install just
        uses: taiki-e/install-action@v2.87.16
        with:
          tool: just@1.40.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 patchelf ccache rpm
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool
          chmod +x /usr/local/bin/appimagetool

      - name: Install Dependencies
        run: uv sync --locked --dev

      - name: Build with Nuitka
        run: just build-release-bundled

      - name: Package tar.gz
        run: tar -czf PxModRim-Linux.tar.gz -C dist entrypoint.dist/

      - name: Upload artifact (tar.gz)
        uses: actions/upload-artifact@v7
        with:
          name: PxModRim-Linux
          path: PxModRim-Linux.tar.gz

      - name: Upload artifact (AppImage)
        uses: actions/upload-artifact@v7
        with:
          name: PxModRim-Linux-AppImage
          path: dist/PxModRim-x86_64.AppImage

      - name: Upload artifact (deb)
        uses: actions/upload-artifact@v7
        with:
          name: PxModRim-Linux-Deb
          path: dist/*.deb

      - name: Upload artifact (rpm)
        uses: actions/upload-artifact@v7
        with:
          name: PxModRim-Linux-RPM
          path: dist/*.rpm

  build-flatpak:
    needs: [build-linux]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Download Linux dist
        uses: actions/download-artifact@v8
        with:
          name: PxModRim-Linux
          path: dist-archive

      - name: Extract Linux dist
        run: |
          mkdir -p dist
          tar -xzf dist-archive/PxModRim-Linux.tar.gz -C dist

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/com.github.PyXiion.PxModRim.yaml
          bundle: com.github.PyXiion.PxModRim.flatpak
          build-bundle: true
          upload-artifact: true
          artifact-name: PxModRim-Flatpak

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@main
        with:
          python-version-file: pyproject.toml

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install just
        uses: taiki-e/install-action@v2.87.16
        with:
          tool: just@1.40.0

      - name: Install Dependencies
        run: uv sync --locked --dev
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --version=3.11 --yes --no-progress
          $nsisDir = Join-Path ${env:ProgramFiles(x86)} "NSIS"
          $makensis = Join-Path $nsisDir "makensis.exe"
          if (-not (Test-Path $makensis)) {
            throw "NSIS installation did not provide makensis.exe"
          }
          $nsisDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "NSIS_DIR=$nsisDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $makensis /VERSION

      - name: Build with Nuitka
        run: just build-release-bundled

      - name: Upload artifact (dist)
        uses: actions/upload-artifact@v7
        with:
          name: PxModRim-Windows
          path: dist/entrypoint.dist/*

      - name: Upload artifact (installer)
        uses: actions/upload-artifact@v7
        with:
          name: PxModRim-Windows-Installer
          path: dist/PxModRim-Setup.exe

  build-macos:
    runs-on: macos-latest
    env:
      MACOS_SIGNING_CONFIGURED: >-
        ${{ secrets.MACOS_CERT != '' &&
            secrets.MACOS_CERT_PASSWORD != '' &&
            secrets.MACOS_SIGNING_IDENTITY != '' &&
            secrets.APPLE_ID != '' &&
            secrets.APPLE_TEAM_ID != '' &&
            secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@main
        with:
          python-version-file: pyproject.toml

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install just
        uses: taiki-e/install-action@v2.87.15
        with:
          tool: just@1.40.0

      - name: Install Dependencies
        run: uv sync --locked --dev

      - name: Build with Nuitka
        run: just build-release-bundled

      - name: Sign and notarize macOS app
        if: env.MACOS_SIGNING_CONFIGURED == 'true'
        env:
          MACOS_CERT: ${{ secrets.MACOS_CERT }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          keychain_password="$(openssl rand -hex 24)"
          keychain_path="$RUNNER_TEMP/pxmodrim-signing.keychain-db"
          certificate="$RUNNER_TEMP/pxmodrim-signing.p12"
          notary_zip="$RUNNER_TEMP/PxModRim-notarize.zip"
          printf '%s' "$MACOS_CERT" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate" \
            -f pkcs12 \
            -P "$MACOS_CERT_PASSWORD" \
            -k "$keychain_path" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          codesign --force --deep --options runtime --timestamp \
            --sign "$MACOS_SIGNING_IDENTITY" dist/PxModRim.app
          codesign --verify --deep --strict dist/PxModRim.app
          ditto -c -k --keepParent dist/PxModRim.app "$notary_zip"
          xcrun notarytool submit "$notary_zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple dist/PxModRim.app
          rm -f dist/PxModRim-macOS.zip dist/PxModRim-macOS.dmg
          ditto -c -k --keepParent dist/PxModRim.app dist/PxModRim-macOS.zip
          hdiutil create -volname PxModRim \
            -srcfolder dist/PxModRim.app \
            -ov -format UDZO dist/PxModRim-macOS.dmg
          xcrun notarytool submit dist/PxModRim-macOS.dmg \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple dist/PxModRim-macOS.dmg
          security delete-keychain "$keychain_path"
          rm -f "$certificate" "$notary_zip"

      - name: Upload artifact (dmg)
        uses: actions/upload-artifact@v7
        with:
          name: PxModRim-macOS-DMG
          path: dist/PxModRim-macOS.dmg

      - name: Upload artifact (zip)
        uses: actions/upload-artifact@v7
        with:
          name: PxModRim-macOS-ZIP
          path: dist/PxModRim-macOS.zip

  release:
    needs: [build-linux, build-flatpak, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: PxModRim-Linux
          path: linux-targz

      - uses: actions/download-artifact@v8
        with:
          name: PxModRim-Linux-AppImage
          path: linux-appimage

      - uses: actions/download-artifact@v8
        with:
          name: PxModRim-Linux-Deb
          path: linux-deb

      - uses: actions/download-artifact@v8
        with:
          name: PxModRim-Linux-RPM
          path: linux-rpm

      - uses: actions/download-artifact@v8
        with:
          name: PxModRim-Flatpak
          path: flatpak

      - uses: actions/download-artifact@v8
        with:
          name: PxModRim-Windows
          path: windows

      - uses: actions/download-artifact@v8
        with:
          name: PxModRim-Windows-Installer
          path: windows-installer

      - uses: actions/download-artifact@v8
        with:
          name: PxModRim-macOS-DMG
          path: macos-dmg

      - uses: actions/download-artifact@v8
        with:
          name: PxModRim-macOS-ZIP
          path: macos-zip

      - name: Package Windows release
        run: 7z a PxModRim-Windows.zip ./windows/*

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            linux-targz/PxModRim-Linux.tar.gz
            linux-appimage/PxModRim-x86_64.AppImage
            linux-deb/*.deb
            linux-rpm/*.rpm
            flatpak/com.github.PyXiion.PxModRim.flatpak
            PxModRim-Windows.zip
            windows-installer/PxModRim-Setup.exe
            macos-dmg/PxModRim-macOS.dmg
            macos-zip/PxModRim-macOS.zip
          generate_release_notes: true
