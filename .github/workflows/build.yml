name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        workshop: [NoWorkshop, SteamWorkshop, NativeWorkshop]
    env:
      UV_NO_SYNC: '1'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@main
        with:
          python-version-file: pyproject.toml

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install just
        uses: taiki-e/install-action@v2.87.25
        with:
          tool: just@1.40.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 patchelf ccache rpm
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool
          chmod +x /usr/local/bin/appimagetool

      - name: Install Dependencies
        run: uv sync --locked --dev ${{ matrix.workshop == 'NoWorkshop' && '--no-install-package pxsteamdl' || '--extra steam' }}

      - name: Build with Nuitka
        run: just build-release-bundled --workshop ${{ matrix.workshop }}

      - name: Verify glibc floor
        run: |
          set -euo pipefail
          max=$(find dist/entrypoint.dist -type f \( -name '*.so*' -o -perm -u+x \) -exec objdump -T {} + 2>/dev/null \
            | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1 || true)
          echo "Highest GLIBC symbol: ${max:-none}"
          test -n "$max"
          test "$(printf '%s\nGLIBC_2.35\n' "$max" | sort -V | tail -1)" = "GLIBC_2.35"

      - name: Package tar.gz
        run: tar -czf PxModRim-Linux-${{ matrix.workshop }}.tar.gz -C dist entrypoint.dist/

      - name: Rename Linux packages
        run: |
          set -euo pipefail
          mv dist/PxModRim-x86_64.AppImage dist/PxModRim-Linux-x86_64-${{ matrix.workshop }}.AppImage
          for f in dist/*.deb; do
            [ -f "$f" ] || continue
            mv "$f" "${f%.deb}-${{ matrix.workshop }}.deb"
          done
          for f in dist/*.rpm; do
            [ -f "$f" ] || continue
            mv "$f" "${f%.rpm}-${{ matrix.workshop }}.rpm"
          done

      - name: Upload artifact (tar.gz)
        uses: actions/upload-artifact@v7
        with:
          name: PxModRim-Linux-${{ matrix.workshop }}
          path: PxModRim-Linux-${{ matrix.workshop }}.tar.gz

      - name: Upload artifact (AppImage)
        uses: actions/upload-artifact@v7
        with:
          name: PxModRim-Linux-AppImage-${{ matrix.workshop }}
          path: dist/PxModRim-Linux-x86_64-${{ matrix.workshop }}.AppImage

      - name: Upload artifact (deb)
        uses: actions/upload-artifact@v7
        with:
          name: PxModRim-Linux-Deb-${{ matrix.workshop }}
          path: dist/*-${{ matrix.workshop }}.deb

      - name: Upload artifact (rpm)
        uses: actions/upload-artifact@v7
        with:
          name: PxModRim-Linux-RPM-${{ matrix.workshop }}
          path: dist/*-${{ matrix.workshop }}.rpm
  build-flatpak:
    needs: [build-linux]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workshop: [NoWorkshop, SteamWorkshop, NativeWorkshop]
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Download Linux dist
        uses: actions/download-artifact@v8
        with:
          name: PxModRim-Linux-${{ matrix.workshop }}
          path: dist-archive

      - name: Extract Linux dist
        run: |
          mkdir -p dist
          tar -xzf dist-archive/PxModRim-Linux-${{ matrix.workshop }}.tar.gz -C dist

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/com.github.PyXiion.PxModRim.yaml
          bundle: PxModRim-Linux-${{ matrix.workshop }}.flatpak
          build-bundle: true
          upload-artifact: true
          artifact-name: PxModRim-Flatpak-${{ matrix.workshop }}
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        workshop: [NoWorkshop, SteamWorkshop, NativeWorkshop]
    env:
      UV_NO_SYNC: '1'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@main
        with:
          python-version-file: pyproject.toml

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install just
        uses: taiki-e/install-action@v2.87.25
        with:
          tool: just@1.40.0

      - name: Install Dependencies
        run: uv sync --locked --dev ${{ matrix.workshop == 'NoWorkshop' && '--no-install-package pxsteamdl' || '--extra steam' }}
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --version=3.11 --yes --no-progress
          $nsisDir = Join-Path ${env:ProgramFiles(x86)} "NSIS"
          $makensis = Join-Path $nsisDir "makensis.exe"
          if (-not (Test-Path $makensis)) {
            throw "NSIS installation did not provide makensis.exe"
          }
          $nsisDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "NSIS_DIR=$nsisDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $makensis /VERSION

      - name: Build with Nuitka
        run: just build-release-bundled --workshop ${{ matrix.workshop }}

      - name: Rename Windows installer
        shell: bash
        run: mv dist/PxModRim-Setup.exe dist/PxModRim-Windows-${{ matrix.workshop }}-Setup.exe

      - name: Upload artifact (dist)
        uses: actions/upload-artifact@v7
        with:
          name: PxModRim-Windows-${{ matrix.workshop }}
          path: dist/entrypoint.dist/*

      - name: Upload artifact (installer)
        uses: actions/upload-artifact@v7
        with:
          name: PxModRim-Windows-Installer-${{ matrix.workshop }}
          path: dist/PxModRim-Windows-${{ matrix.workshop }}-Setup.exe
  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        workshop: [NoWorkshop, SteamWorkshop, NativeWorkshop]
    env:
      UV_NO_SYNC: '1'
      MACOS_SIGNING_CONFIGURED: >-
        ${{ secrets.MACOS_CERT != '' &&
            secrets.MACOS_CERT_PASSWORD != '' &&
            secrets.MACOS_SIGNING_IDENTITY != '' &&
            secrets.APPLE_ID != '' &&
            secrets.APPLE_TEAM_ID != '' &&
            secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@main
        with:
          python-version-file: pyproject.toml

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install just
        uses: taiki-e/install-action@v2.87.25
        with:
          tool: just@1.40.0

      - name: Install Dependencies
        run: uv sync --locked --dev ${{ matrix.workshop == 'NoWorkshop' && '--no-install-package pxsteamdl' || '--extra steam' }}

      - name: Build with Nuitka
        run: just build-release-bundled --workshop ${{ matrix.workshop }}

      - name: Sign and notarize macOS app
        if: env.MACOS_SIGNING_CONFIGURED == 'true'
        env:
          MACOS_CERT: ${{ secrets.MACOS_CERT }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          keychain_password="$(openssl rand -hex 24)"
          keychain_path="$RUNNER_TEMP/pxmodrim-signing.keychain-db"
          certificate="$RUNNER_TEMP/pxmodrim-signing.p12"
          notary_zip="$RUNNER_TEMP/PxModRim-notarize.zip"
          printf '%s' "$MACOS_CERT" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate" \
            -f pkcs12 \
            -P "$MACOS_CERT_PASSWORD" \
            -k "$keychain_path" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          codesign --force --deep --options runtime --timestamp \
            --sign "$MACOS_SIGNING_IDENTITY" dist/PxModRim.app
          codesign --verify --deep --strict dist/PxModRim.app
          ditto -c -k --keepParent dist/PxModRim.app "$notary_zip"
          xcrun notarytool submit "$notary_zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple dist/PxModRim.app
          rm -f dist/PxModRim-macOS.zip dist/PxModRim-macOS.dmg
          ditto -c -k --keepParent dist/PxModRim.app dist/PxModRim-macOS.zip
          hdiutil create -volname PxModRim \
            -srcfolder dist/PxModRim.app \
            -ov -format UDZO dist/PxModRim-macOS.dmg
          xcrun notarytool submit dist/PxModRim-macOS.dmg \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple dist/PxModRim-macOS.dmg
          security delete-keychain "$keychain_path"
          rm -f "$certificate" "$notary_zip"

      - name: Rename macOS packages
        run: |
          set -euo pipefail
          mv dist/PxModRim-macOS.zip dist/PxModRim-macOS-${{ matrix.workshop }}.zip
          mv dist/PxModRim-macOS.dmg dist/PxModRim-macOS-${{ matrix.workshop }}.dmg

      - name: Upload artifact (dmg)
        uses: actions/upload-artifact@v7
        with:
          name: PxModRim-macOS-DMG-${{ matrix.workshop }}
          path: dist/PxModRim-macOS-${{ matrix.workshop }}.dmg

      - name: Upload artifact (zip)
        uses: actions/upload-artifact@v7
        with:
          name: PxModRim-macOS-ZIP-${{ matrix.workshop }}
          path: dist/PxModRim-macOS-${{ matrix.workshop }}.zip
  release:
    needs: [build-linux, build-flatpak, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: PxModRim-*
          path: artifacts
          merge-multiple: false

      - name: Package Windows release
        run: |
          for variant in NoWorkshop SteamWorkshop NativeWorkshop; do
            7z a "PxModRim-Windows-${variant}.zip" "./artifacts/PxModRim-Windows-${variant}/*"
          done

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/PxModRim-Linux-*/*.tar.gz
            artifacts/PxModRim-Linux-AppImage-*/*.AppImage
            artifacts/PxModRim-Linux-Deb-*/*.deb
            artifacts/PxModRim-Linux-RPM-*/*.rpm
            artifacts/PxModRim-Flatpak-*/*.flatpak
            PxModRim-Windows-*.zip
            artifacts/PxModRim-Windows-Installer-*/*-Setup.exe
            artifacts/PxModRim-macOS-DMG-*/*.dmg
            artifacts/PxModRim-macOS-ZIP-*/*.zip
          generate_release_notes: true
