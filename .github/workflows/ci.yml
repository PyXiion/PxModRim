name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

permissions: {}

env:
  QT_VERSION: '6.10.3'
  QCORO_REF: 'v0.13.0'

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.workshop }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        workshop: [NoWorkshop, SteamWorkshop, NativeWorkshop]
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          modules: ${{ matrix.workshop == 'SteamWorkshop' && 'qtshadertools qtpositioning qtwebchannel qtwebengine' || 'qtshadertools' }}

      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libpugixml-dev libzip-dev zipcmp zipmerge ziptool libspdlog-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja ccache pugixml libzip spdlog

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ninja ccache --yes --no-progress
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install pugixml libzip spdlog --triplet x64-windows-static-md

      - name: Build QCoro against Qt
        shell: bash
        run: |
          git clone --depth 1 --branch "$QCORO_REF" https://github.com/qcoro/qcoro.git "$RUNNER_TEMP/qcoro-src"
          cmake -S "$RUNNER_TEMP/qcoro-src" -B "$RUNNER_TEMP/qcoro-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/qcoro" \
            -DUSE_QT_VERSION=6 \
            -DQCORO_WITH_QTDBUS=OFF \
            -DQCORO_WITH_QTWEBSOCKETS=OFF \
            -DQCORO_BUILD_EXAMPLES=OFF \
            -DBUILD_TESTING=OFF
          cmake --build "$RUNNER_TEMP/qcoro-build"
          cmake --install "$RUNNER_TEMP/qcoro-build"

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ci-${{ matrix.os }}-${{ matrix.workshop }}

      - name: Build injected JavaScript
        run: just build-js

      - name: Configure
        shell: bash
        run: |
          extra=()
          if [ "$RUNNER_OS" = "Windows" ]; then
            # QCoro is built Release (/MD); a Debug build (/MDd) would not link.
            extra+=(-DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static-md)
          fi
          cmake --preset default \
            -DPX_WORKSHOP_VARIANT=${{ matrix.workshop }} \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$RUNNER_TEMP/qcoro" \
            "${extra[@]}"

      - name: Install clang tools (Linux SteamWorkshop)
        if: runner.os == 'Linux' && matrix.workshop == 'SteamWorkshop'
        run: |
          # clang-tidy 18 from apt cannot parse libstdc++ 13's <expected>.
          sudo apt-get install -y clang-tidy clang-tools
          pipx install clang-format==22.1.8
          pipx install clang-tidy==22.1.8

      - name: Check formatting (Linux SteamWorkshop)
        if: runner.os == 'Linux' && matrix.workshop == 'SteamWorkshop'
        run: just format-check

      - name: Lint (Linux SteamWorkshop)
        if: runner.os == 'Linux' && matrix.workshop == 'SteamWorkshop'
        run: CLANG_TIDY="$(pipx environment --value PIPX_BIN_DIR)/clang-tidy" just lint

      - name: Build
        run: cmake --build --preset default

      - name: Test
        run: ctest --preset default

  workshop-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cf-workers
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cf-workers/package-lock.json
      - name: Install Worker dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run check
      - name: Exercise bundled Worker with D1
        run: npm test
